[package]
name = "zenith-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "The reading model behind Zenith: document, folder, review and language servers, with no UI."
license = "MIT"
authors = ["Umberto D'Ovidio"]

[dependencies]
# Gitignore-aware walking and the ripgrep search engine. Both are read-only and
# vendored as source; no rg binary is shipped.
ignore = "0.4"
grep = "0.4"

# Real syntax parsing (Sublime grammars) so highlighting is accurate...
syntect = { version = "5.3", default-features = false, features = [
    "default-syntaxes",
    "default-themes",
    "regex-fancy",
] }

serde = { version = "1", features = ["derive"] }
toml = "1"

# Talking to language servers.
serde_json = "1"

[lints]
workspace = true
